trigger:
  - main

pr:
  - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.12'
    displayName: 'Use Python 3.12'

  - script: |
      python -m pip install --upgrade pip
      python -m pip install -e ".[dev]"
    workingDirectory: 'automotive-regression-framework'
    displayName: 'Install package and test dependencies'

  - script: |
      mkdir -p reports
      python -m pytest --junitxml=reports/junit-results.xml \
        --cov=vehicle_testing --cov-report=xml:reports/coverage.xml \
        --cov-report=term-missing
    workingDirectory: 'automotive-regression-framework'
    displayName: 'Run regression suite'

  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: 'automotive-regression-framework/reports/junit-results.xml'
      testRunTitle: 'Automotive regression tests'

  - task: PublishCodeCoverageResults@2
    condition: succeededOrFailed()
    inputs:
      summaryFileLocation: '$(System.DefaultWorkingDirectory)/automotive-regression-framework/reports/coverage.xml'
