name: Python regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automotive-regression-framework
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: automotive-regression-framework/pyproject.toml
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run regression suite and create JUnit report
        run: |
          mkdir -p reports
          pytest --junitxml=reports/junit-${{ matrix.python-version }}.xml \
            --cov=vehicle_testing --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-python-${{ matrix.python-version }}
          path: automotive-regression-framework/reports/

